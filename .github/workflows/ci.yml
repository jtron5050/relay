name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
    env:
      RELAY_DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Relay.slnx
      - name: Build
        run: dotnet build Relay.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Relay.slnx --configuration Release --no-build --no-restore
